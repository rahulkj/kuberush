apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberush
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuberush
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuberush
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuberush
subjects:
  - kind: ServiceAccount
    name: kuberush
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberush
  namespace: default
  labels:
    app: kuberush
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuberush
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kuberush
    spec:
      serviceAccountName: kuberush
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: kuberush
          image: ${HARBOR_REGISTRY_URL}/${HARBOR_PROJECT}/${IMAGE_NAME}:${VERSION}
          imagePullPolicy: Always
          args: []
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kuberush
  namespace: default
  labels:
    app: kuberush
spec:
  selector:
    app: kuberush
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
