# KubeRush example configuration
health:
  listen_address: ":8080"

exporters:
  stdout: true
  otlp_logs:
    enabled: false
    endpoint: "http://localhost:4318"
    compression: "none" # none|gzip
  otlp_traces:
    enabled: false
    endpoint: "http://localhost:4318"
    compression: "none" # none|gzip
  otlp_metrics:
    enabled: false
    endpoint: "http://localhost:4318"
    compression: "none" # none|gzip
  loki:
    enabled: false
    endpoint: "http://localhost:3100"
  splunk_hec:
    enabled: false
    endpoint: "https://localhost:8088/services/collector/event"
    token: ""
    source: "kuberush"
    sourcetype: "_json"
    index: ""
  elasticsearch:
    enabled: false
    endpoint: "http://localhost:9200"
    index: "kuberush-logs"
    username: ""
    password: ""
  prometheus_remote_write:
    enabled: false
    endpoint: "http://localhost:9009/api/v1/push"
    headers: {}
  datadog_logs:
    enabled: false
    endpoint: "" # optional, defaults by site
    site: "datadoghq.com"
    api_key: ""
    service: "kuberush"
  cloudwatch_logs:
    enabled: false
    region: "us-east-1"
    log_group: "/kuberush/logs"
    log_stream: "kuberush"
    endpoint: "" # optional custom endpoint
  gcp_cloud_logging:
    enabled: false
    project_id: ""
    log_name: "" # e.g. projects/<project>/logs/kuberush
    endpoint: "https://logging.googleapis.com"
    access_token: ""
    headers: {}
  azure_monitor_logs:
    enabled: false
    endpoint: "" # https://<dce>.ingest.monitor.azure.com
    dcr_immutable_id: ""
    stream_name: ""
    access_token: ""
    headers: {}
  newrelic:
    enabled: false
    endpoint: "https://otlp.nr-data.net" # OTLP base endpoint
    api_key: ""
    headers: {}

kubernetes:
  namespaces:
    include: []
    exclude: []
  label_selector: ""

log_pipeline:
  batch_size: 200
  flush_interval_ms: 2000
  queue_size: 10000
  max_retries: 3
  retry_backoff_ms: 500
  drop_policy: "drop_newest" # drop_newest|drop_oldest
  dlq_dir: ""   # if set, failed batches are written here for inspection/replay
  spool_dir: "" # if set, enables persistent disk-backed buffering (best-effort WAL)

metrics:
  scrape_interval_seconds: 30
  allow_metric_regex: []
  drop_metric_regex: []
  allow_label_regex: []
  drop_label_regex: []
  max_series_per_scrape: 0

features:
  logs: true
  metrics_scrape: true
  traces_ingest: true
  node_log_tail: false

sharding:
  enabled: false
  strategy: "hashmod" # hashmod
  replicas: 1
  replica_index: 0

