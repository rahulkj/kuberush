# KubeRush example configuration
health:
  listen_address: ":8080"

exporters:
  stdout: true
  otlp_logs:
    enabled: false
    endpoint: "http://localhost:4318"
  otlp_traces:
    enabled: false
    endpoint: "http://localhost:4318"
  otlp_metrics:
    enabled: false
    endpoint: "http://localhost:4318"

kubernetes:
  namespaces:
    include: []
    exclude: []
  label_selector: ""

log_pipeline:
  batch_size: 200
  flush_interval_ms: 2000
  queue_size: 10000

